<!-- popup-card.html — Cookie scoper card for wearehere's popup.
     Insert this div wherever the scoper section should sit in wearehere's
     popup.html. No <html>/<body> wrapper here. -->
<div class="scoper-card">
  <div class="scoper-card-title">Cookie scoper</div>

  <div class="scoper-site-line" id="scoper-site-line">—</div>
  <div class="scoper-impact" id="scoper-impact">—</div>

  <div class="scoper-actions">
    <button id="scoper-sweep-now">Sweep now</button>
    <button id="scoper-trust-toggle">Trust 30d</button>
  </div>
  <div class="scoper-status" id="scoper-status"></div>

  <div class="scoper-footer">
    <span id="scoper-lifetime">— tightened · — killed</span>
    <span class="scoper-footer-sep">·</span>
    <span id="scoper-last-sweep">never swept</span>
  </div>

  <a href="#" id="scoper-open-dashboard" class="scoper-dashboard-link">Open dashboard →</a>
</div>
