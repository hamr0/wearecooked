<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wearecooked</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loading">
  <div id="scan-prompt">
    <p>Click to scan your cookies</p>
    <button id="scanBtn" style="
      background: #6c5ce7; color: #fff; border: none; padding: 14px 36px;
      border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
      margin-top: 12px;
    ">Scan Cookies</button>
  </div>
  <p id="scan-status" style="display:none">Scanning cookies...</p>
</div>
<div id="report" style="display:none"></div>
<script src="cookies.js"></script>
<script src="report.js"></script>
</body>
</html>
